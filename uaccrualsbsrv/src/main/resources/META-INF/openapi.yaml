  /primanota:
    post:
      tags:
        - business
      summary: "Inserisce una nuova prima nota"
      description: |
        Inserisce una nuova prima nota nel sistema.
        L'operazione crea una nuova prima nota con i dati forniti, inclusi testata, conti collegati e attributi opzionali.

        **Condizioni per l'inserimento:**
        - L'utente deve avere il permesso OP-add-primaNota (o OP-SPE-addPrimaNota)
        - L'ente specificato deve esistere
        - I dati della testata devono essere completi (tipo, fonte, evento, causale, stato, data)
        - Devono essere presenti almeno 2 conti con segni diversi (Dare e Avere)
        - Il totale Dare deve coincidere con il totale Avere (bilanciamento contabile)
        - Ogni conto deve avere un segno univoco (non può avere sia Dare che Avere)

        **Algoritmo di inserimento:**
        1. Validazione dei dati di input
        2. Verifica esistenza e validità dei conti (ALG-003)
        3. Verifica bilanciamento scrittura (ALG-004)
        4. Generazione numero provvisorio (se stato = PROVVISORIA)
        5. Generazione numero definitivo (se stato = DEFINITIVA)
        6. Salvataggio testata con audit (data_inserimento, utente_inserimento)
        7. Salvataggio conti collegati
        8. Salvataggio attributi (se presenti)
        9. Aggiornamento contatori (se necessario)

        **Messaggi:**
        - WEB_OK_0004: Salvataggio effettuato correttamente
        - WEB_ERR_0001: Errore imprevisto
        - WEB_ERR_0002: Dato obbligatorio non valorizzato
        - WEB_ERR_018: Almeno 2 conti con segni diversi
        - WEB_ERR_019: Totale Dare e Avere devono coincidere
        - WEB_ERR_020: Stesso conto con segni diversi
        - WEB_ERR_021: Conto non esistente
        - WEB_ERR_022: Conto non valido rispetto alla data
        - WEB_ERR_028: Conto non è foglia
      operationId: inserisciPrimaNota
      parameters:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrimaNotaCreateUpdateDTO'
      responses:
        '201':
          description: |
            Prima nota inserita con successo.
            Messaggio: WEB_OK_0004 - Salvataggio effettuato correttamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrimaNotaDetailDTO'
        '400':
          description: |
            Errore di validazione. Possibili cause:
            - Campi obbligatori non valorizzati
            - Conto non esistente o non valido
            - Scrittura non bilanciata
            - Meno di 2 conti con segni diversi
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            Permesso mancante per l'inserimento di prime note.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: |
            Errore interno del server.
            Messaggio: WEB_ERR_0001 - Si è verificato un errore imprevisto: <dettaglio errore>
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'

