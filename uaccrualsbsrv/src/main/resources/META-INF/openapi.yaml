                    - id: 2
                      codice: "VOCE"
                      descrizione: "Voce di Bilancio - Elemento utilizzato per la classificazione analitica dei conti"
                    - id: 3
                      codice: "SEZIONE"
                      descrizione: "Sezione del Piano dei Conti - Raggruppamento logico di conti correlati"
                    - id: 4
                      codice: "SOTTOCONTO"
                      descrizione: "Sottoconto - Conto secondario aggregato sotto un conto principale"
        default:
