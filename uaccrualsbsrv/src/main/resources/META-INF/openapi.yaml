  /primanota/{anno}/{numero}/annulla:
    post:
      tags:
        - business
      summary: "Annulla una prima nota esistente"
      description: |
        Annulla una prima nota identificata dall'anno e dal numero.
        L'operazione imposta lo stato della prima nota ad 'ANNULLATA' e traccia l'utente che ha richiesto l'operazione.
        
        **Condizioni per l'annullamento:**
        - L'utente deve avere il permesso OP-SPE-annullaPrimaNota
        - L'entità contabile non deve essere in fase PREVISIONE o CHIUSO
        - La prima nota deve esistere e appartenere all'ente specificato
        
        **Algoritmo di annullamento:**
        1. Recupero della prima nota per anno, numero ed ente
        2. Verifica dell'annullabilità (fase entità contabile)
        3. Chiusura dello stato precedente (fineValidita = data sistema)
        4. Inserimento nuovo stato 'ANNULLATA' (inizioValidita = data sistema, fineValidita = null)
        5. Impostazione dataCancellazione e utenteCancellazione
        
        **Messaggi:**
        - WEB_OK_0004: Operazione effettuata con successo
        - WEB_ERR_0001: Errore imprevisto durante l'operazione
      operationId: annullaPrimaNota
      parameters:
        - name: anno
          in: path
          required: true
          description: Anno della prima nota da annullare.
          schema:
            type: integer
            format: int32
        - name: numero
          in: path
          required: true
          description: Numero della prima nota da annullare.
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: |
            Prima nota annullata con successo.
            Messaggio: WEB_OK_0004 - Operazione effettuata con successo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  messaggio:
                    type: string
                    example: "WEB_OK_0004 - Prima nota annullata con successo"
        '400':
          description: |
            Errore di validazione. La prima nota non può essere annullata.
            Possibili cause:
            - Entità contabile in fase PREVISIONE o CHIUSO
            - Prima nota già in stato ANNULLATA
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |
            Prima nota non trovata per l'anno, numero ed ente specificati.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: |
            Errore interno del server.
            Messaggio: WEB_ERR_0001 - Si è verificato un errore imprevisto: <dettaglio errore>
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'

  /primanota/{anno}/{numero}/riapri:
    post:
      tags:
        - business
      summary: "Riapre una prima nota esistente"
      description: |
        Riapre una prima nota identificata dall'anno e dal numero.
        L'operazione riporta lo stato della prima nota da 'DEFINITIVA' a 'PROVVISORIA', 
        mantenendo il numero definitivo e la data di registrazione definitiva già assegnati.

        **Condizioni per la riapertura:**
        - L'utente deve avere il permesso OP-SPE-riapriPrimaNota
        - L'entità contabile non deve essere in fase PREVISIONE o CHIUSO
        - La prima nota deve essere in stato DEFINITIVA

        **Algoritmo di riapertura:**
        1. Recupero della prima nota per anno, numero ed ente
        2. Verifica della riapribilità (fase entità contabile e stato corrente)
        3. Chiusura dello stato precedente (fineValidita = data sistema)
        4. Inserimento nuovo stato 'PROVVISORIA' (inizioValidita = data sistema, fineValidita = null)
        5. Impostazione dataModifica e utenteModifica

        **Messaggi:**
        - WEB_OK_0004: Operazione effettuata con successo
        - WEB_CON_0023: Conferma riapertura (messaggio di conferma)
        - WEB_ERR_0001: Errore imprevisto durante l'operazione
      operationId: riapriPrimaNota
      parameters:
        - name: anno
          in: path
          required: true
          description: Anno della prima nota da riaprire.
          schema:
            type: integer
            format: int32
        - name: numero
          in: path
          required: true
          description: Numero della prima nota da riaprire.
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: |
            Prima nota riaperta con successo.
            Messaggio: WEB_OK_0004 - Operazione effettuata con successo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  messaggio:
                    type: string
                    example: "WEB_OK_0004 - Prima nota riaperta con successo"
        '400':
          description: |
            Errore di validazione. La prima nota non può essere riaperta.
            Possibili cause:
            - Entità contabile in fase PREVISIONE o CHIUSO
            - Prima nota non in stato DEFINITIVA
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |
            Prima nota non trovata per l'anno, numero ed ente specificati.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: |
            Errore interno del server.
            Messaggio: WEB_ERR_0001 - Si è verificato un errore imprevisto: <dettaglio errore>
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'

  /primanota/{anno}/{numero}/valida:
    post:
      tags:
        - business
      summary: "Valida una prima nota esistente"
      description: |
        Valida una prima nota identificata dall'anno e dal numero.
        L'operazione imposta lo stato della prima nota da 'PROVVISORIA' a 'DEFINITIVA' e assegna il numero definitivo se non presente.

        **Condizioni per la validazione:**
        - L'utente deve avere il permesso OP-SPE-validaPrimaNota
        - L'entità contabile non deve essere in fase PREVISIONE o CHIUSO
        - La prima nota deve essere in stato PROVVISORIA

        **Algoritmo di validazione:**
        1. Recupero della prima nota per anno, numero ed ente
        2. Verifica dello stato (deve essere PROVVISORIA)
        3. Verifica fase entità contabile (non PREVISIONE o CHIUSO)
        4. Verifica esistenza numero progressivo definitivo
        5. Se non presente, genera nuovo numero definitivo e imposta data registrazione definitiva
        6. Chiudi lo stato precedente (fineValidita = data sistema)
        7. Inserimento nuovo stato 'DEFINITIVA' (inizioValidita = data sistema, fineValidita = null)

        **Messaggi:**
        - WEB_OK_0004: Operazione effettuata con successo
        - WEB_ERR_0001: Errore imprevisto durante l'operazione
        - WEB_ERR_0002: Dato obbligatorio non valorizzato
      operationId: validaPrimaNota
      parameters:
        - name: anno
          in: path
          required: true
          description: Anno della prima nota da validare.
          schema:
            type: integer
            format: int32
        - name: numero
          in: path
          required: true
          description: Numero della prima nota da validare.
          schema:
            type: integer
            format: int32
        - name: mantieniNumeroDefinitivo
          in: query
          required: false
          description: |
            Parametro opzionale per gestire la rinumerazione quando il parametro ente VERIFICA_RINUMERAZIONE_PRIME_NOTE = SI.
            - true: mantiene il numero definitivo esistente
            - false: riassegna un nuovo numero definitivo
            - null/assente: prima chiamata, il sistema richiede conferma se necessario
          schema:
            type: boolean
        - name: confermato
          in: query
          required: false
          description: |
            Parametro opzionale che indica se l'utente ha confermato la validazione generica (WEB_CON_0016).
            - true: l'utente ha confermato la validazione senza numero definitivo
            - null/assente: prima chiamata, il sistema richiede conferma tramite WEB_CON_0016
          schema:
            type: boolean
      responses:
        '200':
          description: |
            Prima nota validata con successo.
            Messaggio: WEB_OK_0004 - Operazione effettuata con successo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  messaggio:
                    type: string
                    example: "WEB_OK_0004 - Prima nota validata con successo"
        '400':
          description: |
            Errore di validazione. La prima nota non può essere validata.
            Possibili cause:
            - Entità contabile in fase PREVISIONE o CHIUSO
            - Prima nota non in stato PROVVISORIA
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |
            Prima nota non trovata per l'anno, numero ed ente specificati.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            Richiesta di conferma. L'operazione richiede una conferma da parte dell'utente.
            Il client deve ripetere la richiesta con il parametro `mantieniNumeroDefinitivo` appropriato.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: |
            Errore interno del server.
            Messaggio: WEB_ERR_0001 - Si è verificato un errore imprevisto: <dettaglio errore>
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'

  /primanota/valida-massiva:
    post:
      tags:
        - business
      summary: "Valida multiple prime note"
      description: |
        Valida multiple prime note identificate da una lista di anno e numero.
        L'operazione imposta lo stato di ciascuna prima nota da 'PROVVISORIA' a 'DEFINITIVA'.

        **Condizioni per la validazione massiva:**
        - L'utente deve avere il permesso OP-SPE-validaPrimeNote
        - Tutte le prime note devono essere in stato PROVVISORIA
        - L'entità contabile non deve essere in fase PREVISIONE o CHIUSO

        **Algoritmo di validazione massiva:**
        1. Per ogni prima nota nella lista:
           - Recupero della prima nota per anno, numero ed ente
           - Verifica dello stato (deve essere PROVVISORIA)
           - Verifica fase entità contabile
           - Generazione numero definitivo se mancante
           - Impostazione stato DEFINITIVA
        2. Se alcune validazioni falliscono, vengono registrate ma le altre continuano

        **Messaggi:**
        - WEB_OK_0004: Operazione effettuata con successo
        - WEB_ERR_0001: Errore imprevisto durante l'operazione
      operationId: validaPrimeNoteMassiva
      parameters:
        - name: mantieniNumeri
          in: query
          required: false
          description: |
            Parametro opzionale per gestire la rinumerazione quando il parametro ente VERIFICA_RINUMERAZIONE_PRIME_NOTE = SI.
            - true: mantiene i numeri definitivi esistenti
            - false: riassegna nuovi numeri definitivi
            - null/assente: prima chiamata, il sistema richiede conferma se necessario
          schema:
            type: boolean
        - name: confermato
          in: query
          required: false
          description: |
            Parametro opzionale che indica se l'utente ha confermato la validazione massiva generica (WEB_CON_0017).
            - true: l'utente ha confermato la validazione massiva senza numeri definitivi
            - null/assente: prima chiamata, il sistema richiede conferma tramite WEB_CON_0017
          schema:
            type: boolean
      requestBody:
        required: true
        description: Lista di prime note da validare (anno e numero).
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PrimaNotaIdDTO'
      responses:
        '200':
          description: |
            Prime note validate con successo.
            Messaggio: WEB_OK_0004 - Operazione effettuata con successo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  messaggio:
                    type: string
                    example: "WEB_OK_0004 - Prime note validate con successo"
        '400':
          description: |
            Errore di validazione. Alcune prime note non possono essere validate.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            Richiesta di conferma. L'operazione richiede una conferma da parte dell'utente.
            Il client deve ripetere la richiesta con il parametro `mantieniNumeri` appropriato.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: |
            Errore interno del server.
            Messaggio: WEB_ERR_0001 - Si è verificato un errore imprevisto: <dettaglio errore>
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'

