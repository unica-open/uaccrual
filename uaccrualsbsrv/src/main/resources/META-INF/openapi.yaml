      summary: Elenco dei tipi dei piani dei conti
      description: |
        Recupera l'elenco completo dei tipi disponibili per i piani dei conti (PDC) nel sistema.
        I tipi rappresentano le diverse categorie operative in cui vengono classificati i conti contabili
        in base alla loro funzione specifica all'interno del piano dei conti, come ad esempio 'Conto Standard',
        'Voce di Bilancio', 'Sezione del Piano dei Conti', 'Sottoconto', ecc.
        Ogni tipo è identificato da un codice univoco e include una descrizione dettagliata del suo ruolo contabile.
        Questo endpoint fornisce i valori di riferimento standard utilizzati per definire la natura specifica
        di un piano dei conti e viene comunemente utilizzato per popolare liste di selezione nell'interfaccia utente
        o per applicare filtri durante la ricerca e la creazione di nuovi piani dei conti.
        I tipi sono condivisi tra tutti gli enti e rappresentano una classificazione standardizzata della funzione
        contabile di ciascun elemento del piano dei conti.
      operationId: getPdcTipi
      responses:
        "200":
          description: |
            Risposta contenente una lista completa dei tipi dei piani dei conti disponibili nel sistema.
            Ogni elemento include tutti i dettagli del tipo come codice univoco, descrizione completa
            e altri attributi rilevanti per la classificazione contabile.
            Questi valori possono essere utilizzati per comprendere la funzione specifica di un conto,
            per applicare filtri durante la ricerca o per selezionare il tipo appropriato durante la creazione
            di nuovi piani dei conti.
          content:
            application/json:
              schema:
