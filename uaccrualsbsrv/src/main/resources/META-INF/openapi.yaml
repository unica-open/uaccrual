            Si è verificato un errore imprevisto durante il tentativo di recuperare i tipi dei piani dei conti.
            La risposta contiene dettagli sull'errore che possono essere utili per la diagnosi del problema.
            Ciò potrebbe indicare un problema interno al sistema o un'anomalia nella gestione della richiesta.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
  /pdc/stati:
    get:
      tags:
        - business
      summary: Elenco degli stati dei piani dei conti
      description: |
        Recupera l'elenco completo degli stati disponibili per i piani dei conti (PDC) nel sistema.
        Gli stati rappresentano le diverse condizioni operative in cui può trovarsi un conto all'interno
        del ciclo di vita contabile, come ad esempio 'Attivo', 'Inattivo', 'Sospeso', 'Annullato', ecc.
        Ogni stato è identificato da un codice univoco e include una descrizione dettagliata delle sue implicazioni
        operative e contabili. Lo stato di un piano dei conti determina la sua utilizzabilità nei processi contabili
        e la possibilità di modificarlo, eliminarlo o crearvi sottoconti.
        Questo endpoint fornisce i valori di riferimento standard utilizzati per definire la condizione attuale
        di un piano dei conti e viene comunemente utilizzato per popolare liste di selezione nell'interfaccia utente
        o per applicare filtri durante la ricerca e la creazione di nuovi piani dei conti.
        Gli stati sono condivisi tra tutti gli enti e rappresentano una classificazione standardizzata
        della disponibilità operativa di ciascun elemento del piano dei conti.
      operationId: getPdcStati
      responses:
        "200":
          description: |
            Risposta contenente una lista completa degli stati dei piani dei conti disponibili nel sistema.
            Ogni elemento include tutti i dettagli dello stato come codice univoco, descrizione completa
            e altri attributi rilevanti per la classificazione contabile.
            Questi valori possono essere utilizzati per comprendere la condizione operativa corrente di un conto,
            per applicare filtri durante la ricerca o per selezionare lo stato appropriato durante la creazione
            o l'aggiornamento di nuovi piani dei conti.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PdcStato"
              examples:
                pdcStatiResponse:
                  summary: Esempio di risposta con lista completa degli stati dei PDC
                  value:
                    - id: 1
                      codice: "ATTIVO"
                      descrizione: "Conto attivo e pienamente utilizzabile nei processi contabili"
                    - id: 2
                      codice: "INATTIVO"
                      descrizione: "Conto inattivo, non utilizzabile nei processi contabili"
                    - id: 3
                      codice: "SOSPESO"
                      descrizione: "Conto sospeso temporaneamente, non modificabile né utilizzabile"
                    - id: 4
                      codice: "ANNULLATO"
                      descrizione: "Conto annullato, non utilizzabile e non modificabile"
        default:
          description: |
            Si è verificato un errore imprevisto durante il tentativo di recuperare gli stati dei piani dei conti.
            La risposta contiene dettagli sull'errore che possono essere utili per la diagnosi del problema.
            Ciò potrebbe indicare un problema interno al sistema o un'anomalia nella gestione della richiesta.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
  /pdc/famiglie:
    get:
      tags:
        - business
      summary: Elenco delle famiglie dei piani dei conti
      description: |
        Recupera l'elenco completo delle famiglie disponibili per i piani dei conti (PDC) nel sistema.
        Le famiglie rappresentano i principali raggruppamenti logici dei conti in base alla loro funzionalità
        contabile, ambito di utilizzo o configurazione specifica all'interno del sistema, come ad esempio
        'ACCRUAL-A' (per conti di entrata), 'ACCRUAL-B' (per conti di uscita), '118' (per conti speciali), ecc.
        Ogni famiglia è identificata da un codice univoco e include una descrizione dettagliata del suo scopo
        contabile, oltre ad attributi come la modificabilità e la ricercabilità che influenzano il comportamento
        dei conti appartenenti a quella famiglia.
        Le famiglie sono fondamentali per definire le regole di gestione dei conti come la possibilità di
        modificarli, cancellarli, inserirvi sottoconti e altre restrizioni operative. Inoltre, alcune famiglie
        possono avere regole specifiche per quanto riguarda la creazione e l'utilizzo dei conti al loro interno.
        Questo endpoint fornisce i valori di riferimento standard utilizzati per categorizzare e organizzare
        i piani dei conti in base alle loro caratteristiche operative e di gestione.
        Le famiglie sono condivise tra tutti gli enti e rappresentano una struttura di classificazione standardizzata
        che influenza direttamente il comportamento dei conti che vi appartengono.
      operationId: getPdcFamiglie
      responses:
        "200":
          description: |
            Risposta contenente una lista completa delle famiglie dei piani dei conti disponibili nel sistema.
            Ogni elemento include tutti i dettagli della famiglia come codice univoco, descrizione completa,
            indicazione se è modificabile e se è ricercabile, e altri attributi rilevanti per la gestione contabile.
            Questi valori possono essere utilizzati per comprendere il raggruppamento funzionale di un conto,
            per applicare filtri durante la ricerca o per selezionare la famiglia appropriata durante la creazione
            di nuovi piani dei conti, tenendo conto delle regole operative associate a ciascuna famiglia.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PdcFamiglia"
              examples:
                pdcFamiglieResponse:
                  summary: Esempio di risposta con lista completa delle famiglie dei PDC
                  value:
                    - id: 1
                      codice: "ACCRUAL-A"
                      descrizione: "Famiglia A - Conti di Entrata - Utilizzata per conti relativi a entrate e ricavi"
                      modificabile: true
                      ricercabile: true
                    - id: 2
                      codice: "ACCRUAL-B"
                      descrizione: "Famiglia B - Conti di Uscita - Utilizzata per conti relativi a spese e costi"
                      modificabile: true
                      ricercabile: true
                    - id: 3
                      codice: "118"
                      descrizione: "Famiglia 118 - Conti Speciali - Conti con regole operative particolari"
                      modificabile: false
                      ricercabile: false
        default:
          description: |
            Si è verificato un errore imprevisto durante il tentativo di recuperare le famiglie dei piani dei conti.
            La risposta contiene dettagli sull'errore che possono essere utili per la diagnosi del problema.
            Ciò potrebbe indicare un problema interno al sistema o un'anomalia nella gestione della richiesta.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
