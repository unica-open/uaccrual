  /pdc/valida-conto:
    post:
      tags:
        - business
      summary: "Verifica conto da inserire nella scrittura"
      description: |
        Verifica che il conto indicato sia valido per essere inserito in una scrittura contabile.
        Implementa l'algoritmo ALG-003: Verifica Conto da inserire nella scrittura.

        **Controlli effettuati:**
        1. Esistenza del conto (WEB_ERR_021)
        2. Validità rispetto alla data di sistema (WEB_ERR_022)
        3. Conto foglia - deve avere attributo foglia o foglia_non_foglia valorizzati (WEB_ERR_028)

        **Messaggi di errore:**
        - WEB_ERR_021: Il conto indicato non esiste
        - WEB_ERR_022: Il conto indicato non è valido rispetto alla data di sistema
        - WEB_ERR_028: Il conto indicato non è un conto di dettaglio (foglia)
      operationId: validaContoDaInserire
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidaContoRequest"
      responses:
        "204":
          description: Conto verificato con successo
        "400":
          description: Conto non valido
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Errore generico
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
