  /primanota/search:
    post:
      tags:
        - business
      summary: "Ricerca prime note in base a criteri di filtro"
      description: |
        Effettua una ricerca avanzata delle prime note utilizzando criteri di filtro specifici.
        Questo endpoint permette di applicare filtri complessi utilizzando un oggetto di filtro strutturato
        che può includere condizioni multiple su diversi campi.
        La ricerca restituisce una lista paginata e ordinabile delle prime note che soddisfano tutti i criteri specificati.
        I risultati sono limitati all'ente specificato.
      operationId: searchPrimeNote
      parameters:
        - name: sort
          in: query
          description: |
            Criteri di ordinamento nel formato 'campo,direzione' (es. 'numeroProvvisorio,asc', 'dataRegProvvisoria,desc').
            I campi disponibili per l'ordinamento sono: numero provvisorio, data registrazione provvisoria/definitiva, stato, ecc.
          schema:
            type: string
        - name: limit
          in: query
          description: |
            Numero massimo di elementi da restituire per pagina. Valore predefinito: 20.
            Se si desidera ottenere tutti i risultati possibili, utilizzare il valore speciale -1.
            Utilizzato per controllare la dimensione della risposta e ottimizzare le prestazioni.
          schema:
            type: integer
            format: int32
            default: 20
            minimum: -1
            maximum: 2147483647
        - name: offset
          in: query
          description: |
            Numero di elementi da saltare prima di iniziare a restituire i risultati.
            Utilizzato per navigare tra le pagine dei risultati (es. offset=20 per la seconda pagina con limit=20).
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
      requestBody:
        description: |
          Oggetto contenente i criteri di filtro per la ricerca avanzata delle prime note.
          Ogni campo nell'oggetto filtro rappresenta una condizione che i risultati devono soddisfare.
          Tutte le condizioni sono combinate con un operatore logico AND (devono essere soddisfatte contemporaneamente).
          I filtri disponibili includono: tipo, fonte, evento, causale, stato, numero provvisorio/definitivo, date di registrazione, importi, ecc.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrimaNotaSearchFilterDTO'
      responses:
        '200':
          description: |
            Risposta contenente una lista paginata delle prime note che soddisfano tutti i criteri di ricerca specificati.
            Ogni elemento include tutti i dettagli della prima nota come tipo, fonte, evento, causale, numeri provvisorio/definitivo,
            date di registrazione, stato, descrizione e informazioni sulle azioni disponibili.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagePrimaNotaSearchResultDTO'

  /primanota/export:
    post:
      tags:
        - business
      summary: Esportazione CSV delle prime note
      description: |
        Esporta i risultati della ricerca delle prime note in formato CSV (Comma-Separated Values).
        L'endpoint accetta gli stessi criteri di filtro dell'endpoint /primanota/search e restituisce un file CSV
        contenente tutte le prime note che soddisfano i criteri specificati, senza paginazione.
        Il file CSV è codificato in UTF-8 e utilizza il punto e virgola (;) come separatore, compatibile con Excel italiano.
        Il file viene scaricato automaticamente dal browser con nome "primanota_export_YYYY-MM-DD.csv".
      operationId: exportPrimaNotaList
      parameters:
        - name: sort
          in: query
          description: |
            Criteri di ordinamento nel formato 'campo,direzione' (es. 'numeroProvvisorio,asc', 'dataRegProvvisoria,desc').
            I campi disponibili per l'ordinamento sono: numero provvisorio, data registrazione provvisoria/definitiva, stato, ecc.
          schema:
            type: string
      requestBody:
        description: |
          Oggetto contenente i criteri di filtro per l'esportazione delle prime note.
          Ogni campo nell'oggetto filtro rappresenta una condizione che i risultati devono soddisfare.
          Tutte le condizioni sono combinate con un operatore logico AND (devono essere soddisfatte contemporaneamente).
          I filtri disponibili includono: tipo, fonte, evento, causale, stato, numero provvisorio/definitivo, date di registrazione, importi, ecc.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrimaNotaSearchFilterDTO'
      responses:
        "200":
          description: |
            File CSV contenente i risultati della ricerca esportati.
  
  /primanota/{anno}/{numero}:
    get:
      tags:
        - business
      summary: "Recupera il dettaglio di una singola prima nota per anno e numero"
      description: |
        Recupera le informazioni complete di una prima nota specifica identificata dall'anno e dal numero.
        La risposta include tutti i dettagli della prima nota come tipo, fonte, evento, causale, numeri provvisorio/definitivo,
        date di registrazione, stato, descrizione, conti collegati, attributi e prime note collegate.
        L'operazione verifica che la prima nota appartenga all'ente specificato e che sia accessibile dall'utente richiedente.
      operationId: getPrimaNotaByAnnoAndNumero
      parameters:
        - name: anno
          in: path
          required: true
          description: Anno della prima nota da recuperare.
          schema:
            type: integer
            format: int32
        - name: numero
          in: path
          required: true
          description: Numero della prima nota da recuperare.
          schema:
            type: integer
            format: int32
        - name: fields
          in: query
          description: |
            Elenco di campi specifici da includere nella risposta, separati da virgola (es. 'tipo,fonte,stato,descrizione').
            Se omesso, vengono restituiti tutti i campi disponibili.
            Questo parametro permette di ridurre la quantità di dati trasmessi quando sono necessari solo alcuni campi.
          schema:
            type: string
      responses:
        '200':
          description: |
            Prima nota trovata con successo. La risposta contiene tutti i dettagli della prima nota richiesta,
            inclusi tipo, fonte, evento, causale, numeri provvisorio/definitivo, date di registrazione, stato, descrizione,
            conti collegati, attributi e prime note collegate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrimaNotaDetailDTO'

    put:
      tags:
        - business
      summary: "Aggiorna una prima nota esistente"
      description: |
        Aggiorna una prima nota esistente identificata dall'anno e dal numero.
        L'operazione modifica i dati della prima nota, inclusi testata, conti collegati e attributi.

        **Condizioni per l'aggiornamento:**
        - L'utente deve avere il permesso OP-SPE-modificaPrimaNota
        - L'entità contabile non deve essere in fase PREVISIONE o CHIUSO
        - La prima nota deve esistere e appartenere all'ente specificato
        - La prima nota non deve essere in stato ANNULLATA
        - I campi Tipo, Fonte, Evento, Causale, Numero provvisorio, Numero definitivo, Stato NON sono modificabili
        - Sono modificabili solo: Descrizione e Data registrazione provvisoria

        **Algoritmo di aggiornamento:**
        1. Validazione dei dati di input
        2. Recupero prima nota esistente
        3. Verifica esistenza e validità dei conti (ALG-003)
        4. Verifica bilanciamento scrittura (ALG-004)
        5. Aggiornamento testata (solo campi editabili) con audit (data_modifica, utente_modifica)
        6. Cancellazione e reinserimento conti collegati (delta update)
        7. Cancellazione e reinserimento attributi (delta update)

        **Messaggi:**
        - WEB_OK_0004: Salvataggio effettuato correttamente
        - WEB_ERR_0001: Errore imprevisto
        - WEB_ERR_0002: Dato obbligatorio non valorizzato
        - WEB_ERR_018: Almeno 2 conti con segni diversi
        - WEB_ERR_019: Totale Dare e Avere devono coincidere
        - WEB_ERR_020: Stesso conto con segni diversi
        - WEB_ERR_021: Conto non esistente
        - WEB_ERR_022: Conto non valido rispetto alla data
        - WEB_ERR_028: Conto non è foglia
        - WEB_ERR_0004: Prima nota non trovata
      operationId: aggiornaPrimaNota
      parameters:
        - name: anno
          in: path
          required: true
          description: Anno della prima nota da aggiornare.
          schema:
            type: integer
            format: int32
        - name: numero
          in: path
          required: true
          description: Numero della prima nota da aggiornare.
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrimaNotaCreateUpdateDTO'
      responses:
        '200':
          description: |
            Prima nota aggiornata con successo.
            Messaggio: WEB_OK_0004 - Salvataggio effettuato correttamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrimaNotaDetailDTO'
        '400':
          description: |
            Errore di validazione. Possibili cause:
            - Campi obbligatori non valorizzati
            - Conto non esistente o non valido
            - Scrittura non bilanciata
            - Tentativo di modificare campi non editabili
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            Permesso mancante per la modifica della prima nota.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |
            Prima nota non trovata per l'anno, numero ed ente specificati.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: |
            Errore interno del server.
            Messaggio: WEB_ERR_0001 - Si è verificato un errore imprevisto: <dettaglio errore>
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'

