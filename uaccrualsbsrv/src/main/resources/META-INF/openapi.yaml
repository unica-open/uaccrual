openapi: 3.0.1
info:
  title: Accrual API
  description: API per il backend Accrual.
  version: 1.0.0
servers:
  - url: /api/v1
tags:
  - name: system
  - name: security
  - name: business
  - name: test
paths:
  /ping:
    get:
      tags:
        - system
      summary: Servizio di ping per verifica disponibilità
      description: |
        Servizio di controllo della disponibilità del backend che restituisce una risposta immediata
        per confermare che il sistema è attivo e in grado di ricevere ed elaborare richieste HTTP.
        Questo endpoint effettua una verifica di base della connettività e della funzionalità del servizio
        senza eseguire alcuna operazione complessa né accedere a risorse esterne come database o sistemi di caching.
        A differenza dell'endpoint /status, non fornisce dettagli sullo stato interno del sistema né metriche operative.
        È ideale per sistemi di monitoraggio semplici, health check di load balancer e test di connettività di rete.
      operationId: ping
      responses:
        "200":
          description: |
            Risposta positiva al ping. Indica che il servizio è attivo, disponibile e in grado di elaborare richieste.
            La risposta contiene un messaggio di conferma (solitamente "pong") che certifica la capacità del sistema
            di rispondere a richieste HTTP di base. L'header someheader è incluso come esempio per testare la corretta
            gestione degli header di risposta da parte del client.
          headers:
            someheader:
              description: Header di esempio utilizzato per verificare la corretta gestione degli header di risposta.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
              examples:
                pingResponse:
                  summary: Esempio di risposta al ping con conferma di disponibilità
                  value:
                    message: "pong"
        "503":
          description: |
            Servizio non disponibile. Il sistema è temporaneamente offline o in stato di malfunzionamento critico.
            Questo codice di stato indica che il servizio non è attualmente in grado di elaborare alcuna richiesta,
            né semplici ping né operazioni complesse. Potrebbe essere necessario un intervento manuale per ripristinare
            la funzionalità. I sistemi di load balancing solitamente rimuovono temporaneamente il servizio dal pool
            fino al ripristino della funzionalità.
          content:
            application/json:
              schema:
                type: object
        default:
          description: |
            Si è verificato un errore imprevisto durante il tentativo di ping del servizio.
            La risposta contiene dettagli sull'errore che possono essere utili per la diagnosi del problema.
            Questo potrebbe indicare un problema interno al servizio o un'anomalia nella gestione della richiesta.
          content:
            application/problem+json:
              schema:
                type: string
  /soggetti:
    get:
      tags:
        - business
      summary: Elenco dei soggetti
      description: |
        Recupera un elenco dei soggetti (persone fisiche o giuridiche) appartenenti all'ente specificato.
        La risposta include informazioni dettagliate su ogni soggetto come codice, descrizione,
        codice fiscale/partita IVA, stato, tipo e informazioni sull'ente di appartenenza.
        I soggetti rappresentano le entità coinvolte nei processi contabili come fornitori, clienti, ecc.
      operationId: getSoggetti
      parameters:
        - name: fields
          in: query
          description: |
            Elenco di campi specifici da includere nella risposta, separati da virgola (es. 'codice,descrizione,codice_fiscale').
            Se omesso, vengono restituiti tutti i campi disponibili.
            Questo parametro permette di ridurre la quantità di dati trasmessi quando sono necessari solo alcuni campi.
          schema:
            type: string
        - name: customHeader
          in: header
          description: Header personalizzato per testare la gestione degli header HTTP.
          schema:
            type: string
      responses:
        "200":
          description: |
            Risposta contenente una lista dei soggetti che appartengono all'ente specificato.
            Ogni elemento include tutti i dettagli del soggetto come codice, descrizione, codice fiscale/partita IVA,
            stato, tipo e informazioni sull'ente di appartenenza.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Soggetto"
              examples:
                soggettiResponse:
                  summary: Esempio di risposta con lista di soggetti
                  value:
                    - id: 1
                      codice: "SGT001"
                      descrizione: "Soggetto 1 - Fornitore Principale"
                      codice_fiscale: "RSSMRA80A01H501A"
                      partita_iva: "01234567890"
                      email: "fornitore@esempio.com"
                      pa: false
                      istituto_di_credito: false
                      ente:
                        id: 1
                        codice_fiscale: "ENTE001"
                        denominazione: "Comune di Esempio"
                      stato:
                        id: 1
                        codice: "ATTIVO"
                        descrizione: "Attivo"
                      tipo:
                        id: 1
                        codice: "FORNITORE"
                        descrizione: "Fornitore"
        "400":
          description: |
            Richiesta non valida. Il codice ente fornito non è valido o non rispetta il formato atteso.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Si è verificato un errore imprevisto durante il recupero dei soggetti.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
  /soggetti/{codice}:
    get:
      tags:
        - business
      summary: Dettaglio di un soggetto specifico
      description: |
        Recupera le informazioni complete di un soggetto specifico identificato dal suo codice univoco.
        La risposta include tutti i dettagli del soggetto come codice, descrizione, codice fiscale/partita IVA,
        stato, tipo, informazioni sull'ente di appartenenza e attributi come indirizzo email, indicazione se è PA o istituto di credito.
        L'operazione verifica che il soggetto appartenga all'ente specificato e che sia attivo.
      operationId: getSoggettoByCodice
      parameters:
        - name: codice
          in: path
          required: true
          description: Codice univoco del soggetto da recuperare (es. 'SGT001', 'FORNITORE001', ecc.).
          schema:
            type: string
        - name: fields
          in: query
          description: |
            Elenco di campi specifici da includere nella risposta, separati da virgola (es. 'codice,descrizione,codice_fiscale').
            Se omesso, vengono restituiti tutti i campi disponibili.
            Questo parametro permette di ridurre la quantità di dati trasmessi quando sono necessari solo alcuni campi.
          schema:
            type: string
      responses:
        "200":
          description: |
            Soggetto trovato con successo. La risposta contiene tutti i dettagli del soggetto richiesto,
            inclusi informazioni sull'ente di appartenenza, stato e tipo del soggetto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Soggetto"
              examples:
                soggettoResponse:
                  summary: Esempio di risposta con dettaglio soggetto
                  value:
                    id: 1
                    codice: "SGT001"
                    descrizione: "Soggetto 1 - Fornitore Principale"
                    codice_fiscale: "RSSMRA80A01H501A"
                    partita_iva: "01234567890"
                    email: "fornitore@esempio.com"
                    pa: false
                    istituto_di_credito: false
                    ente:
                      id: 1
                      codice_fiscale: "ENTE001"
                      denominazione: "Comune di Esempio"
                    stato:
                      id: 1
                      codice: "ATTIVO"
                      descrizione: "Attivo"
                    tipo:
                      id: 1
                      codice: "FORNITORE"
                      descrizione: "Fornitore"
        "404":
          description: |
            Soggetto non trovato. Non esiste un soggetto con il codice specificato appartenente all'ente indicato,
            oppure il soggetto è inattivo o cancellato.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: |
            Richiesta non valida. Il codice soggetto fornito non è valido o non rispetta il formato atteso.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Si è verificato un errore imprevisto durante il recupero del soggetto.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
  /soggetti/codiceFiscale/{codiceFiscale}:
    get:
      tags:
        - business
      summary: Dettaglio di un soggetto tramite codice fiscale
      description: |
        Recupera le informazioni complete di un soggetto specifico identificato dal suo codice fiscale.
        La risposta include tutti i dettagli del soggetto come codice, descrizione, codice fiscale/partita IVA,
        stato, tipo, informazioni sull'ente di appartenenza e attributi come indirizzo email, indicazione se è PA o istituto di credito.
        L'operazione verifica che il soggetto appartenga all'ente specificato e che sia attivo.
        Questo endpoint è particolarmente utile quando si conosce il codice fiscale ma non il codice interno del soggetto.
      operationId: getSoggettoByCodiceFiscale
      parameters:
        - name: codiceFiscale
          in: path
          required: true
          description: Codice fiscale del soggetto da recuperare (può essere un codice fiscale persona fisica o partita IVA persona giuridica).
          schema:
            type: string
        - name: fields
          in: query
          description: |
            Elenco di campi specifici da includere nella risposta, separati da virgola (es. 'codice,descrizione,codice_fiscale').
            Se omesso, vengono restituiti tutti i campi disponibili.
            Questo parametro permette di ridurre la quantità di dati trasmessi quando sono necessari solo alcuni campi.
          schema:
            type: string
      responses:
        "200":
          description: |
            Soggetto trovato con successo. La risposta contiene tutti i dettagli del soggetto richiesto,
            inclusi informazioni sull'ente di appartenenza, stato e tipo del soggetto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Soggetto"
              examples:
                soggettoResponse:
                  summary: Esempio di risposta con dettaglio soggetto
                  value:
                    id: 1
                    codice: "SGT001"
                    descrizione: "Soggetto 1 - Fornitore Principale"
                    codice_fiscale: "RSSMRA80A01H501A"
                    partita_iva: "01234567890"
                    email: "fornitore@esempio.com"
                    pa: false
                    istituto_di_credito: false
                    ente:
                      id: 1
                      codice_fiscale: "ENTE001"
                      denominazione: "Comune di Esempio"
                    stato:
                      id: 1
                      codice: "ATTIVO"
                      descrizione: "Attivo"
                    tipo:
                      id: 1
                      codice: "FORNITORE"
                      descrizione: "Fornitore"
        "404":
          description: |
            Soggetto non trovato. Non esiste un soggetto con il codice fiscale specificato appartenente all'ente indicato,
            oppure il soggetto è inattivo o cancellato.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: |
            Richiesta non valida. Il codice fiscale fornito non è valido o non rispetta il formato atteso (11 cifre per persona fisica, 11 cifre per partita IVA).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Si è verificato un errore imprevisto durante il recupero del soggetto.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
  /azioni:
    get:
      tags:
        - security
      summary: Elenco azioni associate all'utente corrente
      description: |
        Recupera l'elenco delle azioni (permessi) associate all'utente autenticato.
        Sia l'identità dell'utente che il codice ente corrente vengono estratti automaticamente dal token JWT.
      operationId: getAzioni
      parameters:
        - name: group_by
          in: query
          required: false
          description: |
            Criterio di raggruppamento delle azioni.
            Se omesso o vuoto, restituisce una lista piatta di azioni.
            Se impostato a `gruppo`, restituisce le azioni raggruppate per GruppoAzione.
          schema:
            type: string
            enum: [gruppo]
            default: ""
      responses:
        "200":
          description: |
            Elenco delle azioni (permessi) associate all'utente specificato.
            Se group_by è omesso: lista piatta di Azione.
            Se group_by=gruppo: lista di GruppoAzione con azioni annidate.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/Azione"
                  - type: array
                    items:
                      $ref: "#/components/schemas/GruppoAzione"
              examples:
                azioniResponseFlat:
                  summary: Lista piatta (default)
                  value:
                    - id: 1
                      codice: "PDC_CREATE"
                      descrizione: "Permesso di creare nuovi piani dei conti"
                      ordine: 1
                      path: "/pdc/crea"
                      gruppo_azione:
                        id: 1
                        codice: "PDC"
                        descrizione: "Gestione Piani dei Conti"
                    - id: 2
                      codice: "PDC_READ"
                      descrizione: "Permesso di leggere i piani dei conti"
                      ordine: 2
                      path: "/pdc"
                      gruppo_azione:
                        id: 1
                        codice: "PDC"
                        descrizione: "Gestione Piani dei Conti"
                azioniGroupedResponse:
                  summary: Raggruppate per gruppo (group_by=gruppo)
                  value:
                    - id: 1
                      codice: "PDC"
                      descrizione: "Gestione Piani dei Conti"
                      azioni:
                        - id: 1
                          codice: "PDC_CREATE"
                          descrizione: "Permesso di creare nuovi piani dei conti"
                          ordine: 1
                          path: "/pdc/crea"
                        - id: 2
                          codice: "PDC_READ"
                          descrizione: "Permesso di leggere i piani dei conti"
                          ordine: 2
                          path: "/pdc"
                    - id: 2
                      codice: "SOGGETTI"
                      descrizione: "Gestione Soggetti"
                      azioni:
                        - id: 3
                          codice: "SOG_READ"
                          descrizione: "Permesso di leggere i soggetti"
                          ordine: 1
                          path: "/soggetti"
        "404":
          description: |
            Utente non trovato. Non esiste un utente associato al codice fiscale estratto dal JWT,
            oppure l'utente non ha alcuna azione (permesso) associata.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Si è verificato un errore imprevisto durante il recupero delle azioni associate all'utente.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
  /pdc:
    get:
      tags:
        - business
      summary: Elenco paginato e ordinato dei piani dei conti
      description: |
        Recupera un elenco paginato e ordinabile dei piani dei conti (PDC) appartenenti all'ente specificato.
        La risposta include informazioni dettagliate su ogni conto come codice, descrizione, struttura gerarchica,
        stato, tipo, classe e famiglia. La paginazione permette di gestire grandi volumi di dati in modo efficiente.
        Il filtro predefinito mostra solo i conti attivi e ricercabili nell'anno corrente.
      operationId: getPdcList
      parameters:
        - name: sort
          in: query
          description: |
            Criteri di ordinamento nel formato 'campo,direzione' (es. 'codice,asc', 'descrizione,desc').
            I campi disponibili per l'ordinamento sono: codice, descrizione, livello, data di inserimento, ecc.
          schema:
            type: string
        - name: limit
          in: query
          description: |
            Numero massimo di elementi da restituire per pagina. Valore predefinito: 20.
            Se si desidera ottenere tutti i risultati possibili, utilizzare il valore speciale -1.
            Utilizzato per controllare la dimensione della risposta e ottimizzare le prestazioni.
          schema:
            type: integer
            format: int32
            default: 20
            minimum: -1
            maximum: 2147483647  # Integer.MAX_VALUE
        - name: offset
          in: query
          description: |
            Numero di elementi da saltare prima di iniziare a restituire i risultati.
            Utilizzato per navigare tra le pagine dei risultati (es. offset=20 per la seconda pagina con limit=20).
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
      responses:
        "200":
          description: |
            Risposta contenente una lista paginata dei piani dei conti che soddisfano i criteri richiesti.
            Ogni elemento include tutti i dettagli del conto come codice, descrizione, struttura gerarchica,
            stato, tipo, classe, famiglia e informazioni sull'ente di appartenenza.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedPdc"
              examples:
                pagedPdcResponse:
                  summary: Esempio di risposta con lista paginata di PDC
                  value:
                    data:
                      - id: 1
                        codice: "1.1.1"
                        codice_ufficiale: "1.1.1"
                        descrizione: "Conto di entrata primario"
                        livello: 3
                        foglia: true
                        modificabile: true
                        eliminabile: true
                        inseribile_figlio: false
                        ente:
                          id: 1
                          codice_fiscale: "ENTE001"
                          denominazione: "Comune di Esempio"
                        pdc_famiglia:
                          id: 1
                          codice: "ACCRUAL-A"
                          descrizione: "Famiglia A - Entrate"
                          modificabile: true
                          ricercabile: true
                        pdc_classe:
                          id: 1
                          codice: "EP"
                          descrizione: "Entrata/Spesa"
                        pdc_tipo:
                          id: 1
                          codice: "CONTO"
                          descrizione: "Conto standard"
                        pdc_stato:
                          id: 1
                          codice: "ATTIVO"
                          descrizione: "Attivo"
                    page: 0
                    page_size: 20
                    total_elements: 1
        default:
          description: Si è verificato un errore imprevisto durante l'elaborazione della richiesta.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - business
      summary: Crea un nuovo piano dei conti
      description: |
        Crea un nuovo conto nel piano dei conti (PDC) per l'ente specificato.
        Il nuovo conto verrà inserito nella struttura gerarchica del PDC con i dettagli forniti.
        Durante la creazione vengono calcolati automaticamente alcuni campi derivati come il codice ufficiale
        e il livello gerarchico in base al conto padre (se specificato).
        Il sistema esegue tutte le validazioni necessarie prima di salvare il nuovo conto.
      operationId: createPdc
      parameters:
      requestBody:
        description: |
          Oggetto contenente i dettagli del nuovo piano dei conti da creare.
          Devono essere forniti almeno i campi obbligatori come codice, descrizione, famiglia, tipo, classe e stato.
          Il campo 'pdcPadre' è opzionale e serve per indicare il conto genitore nella struttura gerarchica.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Pdc"
        required: true
      responses:
        "201":
          description: |
            Nuovo piano dei conti creato con successo. La risposta contiene tutti i dettagli del conto appena creato,
            inclusi i valori calcolati automaticamente come il codice ufficiale e il livello gerarchico.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pdc"
              examples:
                pdcResponse:
                  summary: Esempio di risposta con PDC creato
                  value:
                    id: 1
                    codice: "1.1.1"
                    codice_ufficiale: "1.1.1"
                    descrizione: "Conto di entrata primario"
                    livello: 3
                    foglia: true
                    modificabile: true
                    eliminabile: true
                    inseribile_figlio: false
                    ente:
                      id: 1
                      codice_fiscale: "ENTE001"
                      denominazione: "Comune di Esempio"
                    pdc_famiglia:
                      id: 1
                      codice: "ACCRUAL-A"
                      descrizione: "Famiglia A - Entrate"
                      modificabile: true
                      ricercabile: true
                    pdc_classe:
                      id: 1
                      codice: "EP"
                      descrizione: "Entrata/Spesa"
                    pdc_tipo:
                      id: 1
                      codice: "CONTO"
                      descrizione: "Conto standard"
                    pdc_stato:
                      id: 1
                      codice: "ATTIVO"
                      descrizione: "Attivo"
        "400":
          description: |
            Richiesta non valida. I dati forniti non soddisfano i requisiti di validazione.
            Potrebbe trattarsi di campi obbligatori mancanti, valori non validi o violazione di vincoli di business.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            Conflitto durante la creazione del conto. Potrebbe trattarsi di un codice già esistente
            o di un tentativo di creare un conto in una posizione gerarchica non consentita.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Si è verificato un errore imprevisto durante la creazione del piano dei conti.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
  /pdc/search:
    post:
      tags:
        - business
      summary: Ricerca avanzata dei piani dei conti
      description: |
        Effettua una ricerca avanzata dei piani dei conti (PDC) utilizzando criteri di filtro specifici.
        A differenza dell'endpoint GET /pdc, questo endpoint permette di applicare filtri complessi
        utilizzando un oggetto di filtro strutturato che può includere condizioni multiple su diversi campi.
        La ricerca restituisce una lista paginata e ordinabile dei conti che soddisfano tutti i criteri specificati.
        I risultati sono limitati all'ente specificato e includono solo conti attivi e ricercabili per l'anno corrente.
      operationId: searchPdc
      parameters:
        - name: sort
          in: query
          description: |
            Criteri di ordinamento nel formato 'campo,direzione' (es. 'codice,asc', 'descrizione,desc').
            I campi disponibili per l'ordinamento sono: codice, descrizione, livello, data di inserimento, ecc.
          schema:
            type: string
        - name: limit
          in: query
          description: |
            Numero massimo di elementi da restituire per pagina. Valore predefinito: 20.
            Se si desidera ottenere tutti i risultati possibili, utilizzare il valore speciale -1.
            Utilizzato per controllare la dimensione della risposta e ottimizzare le prestazioni.
          schema:
            type: integer
            format: int32
            default: 20
            minimum: -1
            maximum: 2147483647  # Integer.MAX_VALUE
        - name: offset
          in: query
          description: |
            Numero di elementi da saltare prima di iniziare a restituire i risultati.
            Utilizzato per navigare tra le pagine dei risultati (es. offset=20 per la seconda pagina con limit=20).
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
      requestBody:
        description: |
          Oggetto contenente i criteri di filtro per la ricerca avanzata dei piani dei conti.
          Ogni campo nell'oggetto filtro rappresenta una condizione che i risultati devono soddisfare.
          Tutte le condizioni sono combinate con un operatore logico AND (devono essere soddisfatte contemporaneamente).
          I filtri disponibili includono: famiglia, codice evento, classe, tipo, stato, descrizione, ecc.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PdcFilter'
            examples:
              pdcFilterExample:
                summary: Esempio di risposta con risultati della ricerca PDC
                value:
                  famiglia: "ACCRUAL-A"
                  codice_evento: "APE_ATT"
                  pdc_classe_codice: "EP"
                  pdc_stato_codice: "ATTIVO"
                  descrizione: "contanti"
                  livello: 3
      responses:
        "200":
          description: |
            Risposta contenente una lista paginata dei piani dei conti che soddisfano tutti i criteri di ricerca specificati.
            Ogni elemento include tutti i dettagli del conto come codice, descrizione, struttura gerarchica,
            stato, tipo, classe, famiglia e informazioni sull'ente di appartenenza.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedPdc"
              examples:
                pagedPdcResponse:
                  summary: Esempio di risposta con risultati della ricerca PDC
                  value:
                    data:
                      - id: 1
                        codice: "1.1.1"
                        codice_ufficiale: "1.1.1"
                        descrizione: "Conto di entrata primario"
                        livello: 3
                        foglia: true
                        modificabile: true
                        eliminabile: true
                        inseribile_figlio: false
                        ente:
                          id: 1
                          codice_fiscale: "ENTE001"
                          denominazione: "Comune di Esempio"
                        pdc_famiglia:
                          id: 1
                          codice: "ACCRUAL-A"
                          descrizione: "Famiglia A - Entrate"
                          modificabile: true
                          ricercabile: true
                        pdc_classe:
                          id: 1
                          codice: "EP"
                          descrizione: "Entrata/Spesa"
                        pdc_tipo:
                          id: 1
                          codice: "CONTO"
                          descrizione: "Conto standard"
                        pdc_stato:
                          id: 1
                          codice: "ATTIVO"
                          descrizione: "Attivo"
                    page: 0
                    page_size: 20
                    total_elements: 1
        "400":
          description: |
            Richiesta non valida. I criteri di filtro forniti non soddisfano i requisiti di validazione.
            Potrebbe trattarsi di campi di filtro non validi o valori non conformi ai tipi attesi.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Si è verificato un errore imprevisto durante l'elaborazione della ricerca.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
  /pdc/export:
    post:
      tags:
        - business
      summary: Esportazione CSV dei piani dei conti
      description: |
        Esporta i risultati della ricerca dei piani dei conti (PDC) in formato CSV (Comma-Separated Values).
        L'endpoint accetta gli stessi criteri di filtro dell'endpoint /pdc/search e restituisce un file CSV
        contenente tutti i conti che soddisfano i criteri specificati, senza paginazione.
        Il file CSV è codificato in UTF-8 e utilizza il punto e virgola (;) come separatore, compatibile con Excel italiano.
        Il file viene scaricato automaticamente dal browser con nome "pdc_export_YYYY-MM-DD.csv".
      operationId: exportPdcList
      parameters:
        - name: sort
          in: query
          description: |
            Criteri di ordinamento nel formato 'campo,direzione' (es. 'codice,asc', 'descrizione,desc').
            I campi disponibili per l'ordinamento sono: codice_ufficiale, descrizione, livello, ecc.
          schema:
            type: string
      requestBody:
        description: |
          Oggetto contenente i criteri di filtro per l'esportazione dei piani dei conti.
          Ogni campo nell'oggetto filtro rappresenta una condizione che i risultati devono soddisfare.
          Tutte le condizioni sono combinate con un operatore logico AND (devono essere soddisfatte contemporaneamente).
          I filtri disponibili includono: famiglia, codice evento, classe, tipo, stato, descrizione, ecc.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PdcFilter'
            examples:
              pdcFilterExample:
                summary: Esempio di filtro per esportazione PDC
                value:
                  famiglia: "ACCRUAL-A"
                  codice_evento: "APE_ATT"
                  pdc_classe_codice: "EP"
                  pdc_stato_codice: "ATTIVO"
                  descrizione: "contanti"
      responses:
        "200":
          description: |
            File CSV contenente i risultati della ricerca esportati.
            Il file include un header con i nomi dei campi e una riga per ogni conto PdC.
            Formato: Codice Ufficiale;Codice;Descrizione;Classe;Tipo;Stato;Livello;Inizio Validità;Fine Validità
          headers:
            Content-Disposition:
              description: Header che indica il download del file con nome "pdc_export_YYYY-MM-DD.csv"
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
                format: binary
              example: |
                Codice Ufficiale;Codice;Descrizione;Classe;Tipo;Stato;Livello;Inizio Validità;Fine Validità
                ACCR.0;ACCR.0;PIANO DEI CONTI;PATRIMONIALE;SINTETICO;A-Attivo;1;2025-01-01;
                ACCR.0.001;ACCR.0.1;ATTIVITA' FINANZIARIE;PATRIMONIALE;SINTETICO;A-Attivo;2;2025-01-01;
        "400":
          description: |
            Richiesta non valida. I criteri di filtro forniti non soddisfano i requisiti di validazione.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: |
            Errore interno durante la generazione del CSV.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Si è verificato un errore imprevisto durante l'esportazione.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
  /pdc/search-tree:
    post:
      tags:
        - business
      summary: Ricerca avanzata dei piani dei conti in formato gerarchico
      description: |
        Effettua una ricerca avanzata dei piani dei conti (PDC) utilizzando criteri di filtro specifici
        e restituisce i risultati in formato gerarchico (albero).
        A differenza dell'endpoint GET /pdc, questo endpoint permette di applicare filtri complessi
        utilizzando un oggetto di filtro strutturato che può includere condizioni multiple su diversi campi.
        La ricerca restituisce una lista gerarchica dei conti che soddisfano tutti i criteri specificati.
        I risultati sono limitati all'ente specificato e includono solo conti attivi e ricercabili per l'anno corrente.
      operationId: searchPdcTree
      parameters:
      requestBody:
        description: |
          Oggetto contenente i criteri di filtro per la ricerca avanzata dei piani dei conti in formato gerarchico.
          Ogni campo nell'oggetto filtro rappresenta una condizione che i risultati devono soddisfare.
          Tutte le condizioni sono combinate con un operatore logico AND (devono essere soddisfatte contemporaneamente).
          I filtri disponibili includono: famiglia, codice evento, classe, tipo, stato, descrizione, ecc.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PdcTreeFilter'
      responses:
        "200":
          description: |
            Risposta contenente una lista gerarchica dei piani dei conti che soddisfano tutti i criteri di ricerca specificati.
            Ogni elemento include tutti i dettagli del conto come codice, descrizione, struttura gerarchica,
            stato, tipo, classe, famiglia e informazioni sull'ente di appartenenza.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PdcTreeResult"
  /pdc/{codiceUfficiale}/{codiceClasse}/{codiceFamiglia}:
    get:
      tags:
        - business
      summary: Dettaglio di un piano dei conti specifico
      description: |
        Recupera le informazioni complete di un piano dei conti (PDC) specifico identificato dalla sua chiave logica univoca
        composta da codice ufficiale, classe e famiglia.
        La risposta include tutti i dettagli del conto come codice, descrizione, struttura gerarchica (conto padre),
        stato, tipo, classe, famiglia, informazioni sull'ente di appartenenza e attributi come modificabilità ed eliminabilità.
        L'operazione verifica che il conto appartenga all'ente specificato e che sia attivo e ricercabile.
      operationId: getPdcByCodiceUfficialeClasseFamiglia
      parameters:
        - name: codiceUfficiale
          in: path
          required: true
          description: Codice ufficiale del piano dei conti da recuperare (es. '1.1.1', '2.3.4.5', ecc.).
          schema:
            type: string
        - name: codiceClasse
          in: path
          required: true
          description: Codice della classe del piano dei conti da recuperare (es. 'AP', 'SP', ecc.).
          schema:
            type: string
        - name: codiceFamiglia
          in: path
          required: true
          description: Codice della famiglia del piano dei conti da recuperare (es. 'ACCRUAL-UTENTE', ecc.).
          schema:
            type: string
        - name: fields
          in: query
          description: |
            Elenco di campi specifici da includere nella risposta, separati da virgola (es. 'codice,descrizione,ente').
            Se omesso, vengono restituiti tutti i campi disponibili.
            Questo parametro permette di ridurre la quantità di dati trasmessi quando sono necessari solo alcuni campi.
          schema:
            type: string
      responses:
        "200":
          description: |
            Piano dei conti trovato con successo. La risposta contiene tutti i dettagli del conto richiesto,
            inclusi i riferimenti gerarchici (conto padre), informazioni sull'ente, stato, tipo, classe e famiglia.
            Vengono anche forniti indicatori booleani per determinare se il conto è modificabile, eliminabile o se è possibile inserire sottoconti.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pdc"
              examples:
                pdcResponse:
                  summary: Esempio di risposta con dettaglio PDC
                  value:
                    id: 1
                    codice: "1.1.1"
                    codice_ufficiale: "1.1.1"
                    descrizione: "Conto di entrata primario"
                    livello: 3
                    foglia: true
                    modificabile: true
                    eliminabile: true
                    inseribile_figlio: false
                    ente:
                      id: 1
                      codice_fiscale: "ENTE001"
                      denominazione: "Comune di Esempio"
                    pdc_famiglia:
                      id: 1
                      codice: "ACCRUAL-A"
                      descrizione: "Famiglia A - Entrate"
                      modificabile: true
                      ricercabile: true
                    pdc_classe:
                      id: 1
                      codice: "EP"
                      descrizione: "Entrata/Spesa"
                    pdc_tipo:
                      id: 1
                      codice: "CONTO"
                      descrizione: "Conto standard"
                    pdc_stato:
                      id: 1
                      codice: "ATTIVO"
                      descrizione: "Attivo"
        "404":
          description: |
            Piano dei conti non trovato. Non esiste un conto con la combinazione specificata di codice ufficiale, classe e famiglia
            appartenente all'ente indicato, oppure il conto è inattivo, non ricercabile o cancellato.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: |
            Richiesta non valida. I parametri forniti (codice ufficiale, classe o famiglia) non sono validi o non rispettano il formato atteso.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Si è verificato un errore imprevisto durante il recupero del piano dei conti.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags:
        - business
      summary: Aggiorna un piano dei conti esistente
      description: |
        Aggiorna i dettagli di un piano dei conti (PDC) esistente identificato dal suo codice univoco.
        L'aggiornamento può modificare vari attributi del conto come descrizione, stato, tipo, classe, famiglia, ecc.
        Il sistema esegue tutte le validazioni necessarie prima di applicare le modifiche e tiene conto
        di eventuali vincoli di business come la fase operativa del bilancio, la possibilità di modifica
        in base alla famiglia del conto e altri controlli di integrità.
        Viene utilizzato il meccanismo di optimistic locking tramite il campo 'version' per evitare
        conflitti di aggiornamento quando più utenti modificano contemporaneamente lo stesso conto.
      operationId: updatePdcByTripleKey
      parameters:
        - name: codiceUfficiale
          in: path
          required: true
          description: Codice ufficiale del piano dei conti da aggiornare (es. '1.1.1', '2.3.4.5', ecc.).
          schema:
            type: string
        - name: codiceClasse
          in: path
          required: true
          description: Codice della classe del piano dei conti da aggiornare (es. 'AP', 'SP', ecc.).
          schema:
            type: string
        - name: codiceFamiglia
          in: path
          required: true
          description: Codice della famiglia del piano dei conti da aggiornare (es. 'ACCRUAL-UTENTE', ecc.).
          schema:
            type: string
      requestBody:
        description: |
          Oggetto contenente i nuovi valori per i campi del piano dei conti.
          Possono essere aggiornati uno o più campi contemporaneamente.
          Il campo 'version' è obbligatorio e deve corrispondere alla versione corrente del record
          per garantire la consistenza dei dati durante l'aggiornamento concorrente.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Pdc"
        required: true
      responses:
        "200":
          description: |
            Piano dei conti aggiornato con successo. La risposta contiene tutti i dettagli del conto
            dopo l'applicazione delle modifiche, inclusi eventuali aggiornamenti automatici ai campi
            derivati come il codice ufficiale in caso di modifiche alla struttura gerarchica.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pdc"
              examples:
                pdcResponse:
                  summary: Esempio di risposta con PDC aggiornato
                  value:
                    id: 1
                    codice: "1.1.1"
                    codice_ufficiale: "1.1.1"
                    descrizione: "Conto di entrata primario - AGGIORNATO"
                    livello: 3
                    foglia: true
                    modificabile: true
                    eliminabile: true
                    inseribile_figlio: false
                    version: 2
                    ente:
                      id: 1
                      codice_fiscale: "ENTE001"
                      denominazione: "Comune di Esempio"
                    pdc_famiglia:
                      id: 1
                      codice: "ACCRUAL-A"
                      descrizione: "Famiglia A - Entrate"
                      modificabile: true
                      ricercabile: true
                    pdc_classe:
                      id: 1
                      codice: "EP"
                      descrizione: "Entrata/Spesa"
                    pdc_tipo:
                      id: 1
                      codice: "CONTO"
                      descrizione: "Conto standard"
                    pdc_stato:
                      id: 1
                      codice: "ATTIVO"
                      descrizione: "Attivo"
        "404":
          description: |
            Piano dei conti non trovato. Non esiste un conto con il codice specificato appartenente all'ente indicato,
            oppure il conto è inattivo, non ricercabile o cancellato.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: |
            Richiesta non valida. I dati forniti non soddisfano i requisiti di validazione.
            Potrebbe trattarsi di campi obbligatori mancanti, valori non validi, violazione di vincoli di business
            o versione del record non corrispondente (indicando che il record è stato modificato da un altro utente).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            Conflitto durante l'aggiornamento del conto. Potrebbe trattarsi di un tentativo di aggiornare
            un record che è stato modificato da un altro utente nel frattempo (version mismatch),
            o di un tentativo di modificare un conto in una posizione gerarchica non consentita.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Si è verificato un errore imprevisto durante l'aggiornamento del piano dei conti.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - business
      summary: Elimina (annulla) un piano dei conti
      description: |
        Annulla un piano dei conti (PDC) esistente identificato dalla sua chiave logica univoca
        composta da codice ufficiale, classe e famiglia.
        L'operazione non cancella fisicamente il record dal database ma ne cambia lo stato impostando
        la data di cancellazione, effettuando quindi una cancellazione logica.
        Prima dell'eliminazione vengono eseguite tutte le verifiche necessarie per assicurare
        che il conto possa essere eliminato (es. non deve avere legami con altri oggetti del sistema,
        deve essere un conto foglia, ecc.). L'eliminazione è consentita solo se il conto appartiene
        all'ente specificato e soddisfa i requisiti di business per l'eliminazione.
      operationId: deletePdcByTripleKey
      parameters:
        - name: codiceUfficiale
          in: path
          required: true
          description: Codice ufficiale del piano dei conti da eliminare (es. '1.1.1', '2.3.4.5', ecc.).
          schema:
            type: string
        - name: codiceClasse
          in: path
          required: true
          description: Codice della classe del piano dei conti da eliminare (es. 'AP', 'SP', ecc.).
          schema:
            type: string
        - name: codiceFamiglia
          in: path
          required: true
          description: Codice della famiglia del piano dei conti da eliminare (es. 'ACCRUAL-UTENTE', ecc.).
          schema:
            type: string
      responses:
        "204":
          description: |
            Piano dei conti eliminato con successo. La risposta indica che l'operazione è stata completata
            con successo ma non restituisce alcun contenuto. Il conto è stato contrassegnato come cancellato
            tramite l'impostazione della data di cancellazione e non sarà più visibile nelle ricerche standard.
        "404":
          description: |
            Piano dei conti non trovato. Non esiste un conto con il codice specificato appartenente all'ente indicato,
            oppure il conto è già stato cancellato in precedenza.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: |
            Impossibile eliminare il piano dei conti. Il conto non soddisfa i requisiti per l'eliminazione,
            ad esempio perché non è un conto foglia (ha sottoconti), oppure perché è coinvolto in altre
            relazioni che impediscono la sua cancellazione (es. movimenti contabili associati).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: |
            Eliminazione non consentita. L'utente non ha i permessi necessari per eliminare il piano dei conti
            o il conto non soddisfa i requisiti di business per l'eliminazione (es. fase operativa del bilancio
            non consente modifiche, conto non modificabile per motivi di configurazione, ecc.).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Si è verificato un errore imprevisto durante l'eliminazione del piano dei conti.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
  /pdc/{codiceUfficiale}/{codiceClasse}/{codiceFamiglia}/relazioni:
    get:
      tags:
        - business
      summary: Ottiene tutte le relazioni associate a un PdC specifico
      description: |
        Recupera un elenco delle relazioni associate a un piano dei conti (PDC) specifico identificato dalla sua chiave logica univoca
        composta da codice ufficiale, classe e famiglia.
        La risposta include informazioni dettagliate sui conti collegati attraverso relazioni di tipo FONDO o CORRELAZIONE.
        E' possibile filtrare i risultati specificando il tipo di relazione tramite il parametro query 'tipo'.
        Ogni relazione include dettagli come tipo di relazione, classe, tipo, livello, segmento, codice e descrizione del conto collegato.
      operationId: getPdcRelazioniByKey
      parameters:
        - name: codiceUfficiale
          in: path
          required: true
          description: Codice ufficiale del piano dei conti da cui recuperare le relazioni (es. '1.1.1', '2.3.4.5', ecc.).
          schema:
            type: string
        - name: codiceClasse
          in: path
          required: true
          description: Codice della classe del piano dei conti da cui recuperare le relazioni (es. 'AP', 'SP', ecc.).
          schema:
            type: string
        - name: codiceFamiglia
          in: path
          required: true
          description: Codice della famiglia del piano dei conti da cui recuperare le relazioni (es. 'ACCRUAL-UTENTE', ecc.).
          schema:
            type: string
        - name: tipo
          in: query
          required: false
          description: |
            Tipo di relazione da filtrare. Valori possibili: FONDO, CORRELAZIONE.
            Se omesso, vengono restituite tutte le relazioni associate al PdC.
          schema:
            type: string
            enum: [FONDO, CORRELAZIONE]
      responses:
        "200":
          description: |
            Relazioni trovate con successo. La risposta contiene una lista dei conti collegati
            al PdC specificato attraverso relazioni di tipo FONDO o CORRELAZIONE.
            Ogni elemento include le informazioni necessarie per visualizzare i dettagli del conto collegato
            come richiesto dalle sezioni "FONDO" e "CORRELAZIONE DLGS 118" del dettaglio PdC.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PdcContoRelazione"
              examples:
                pdcRelazioniResponse:
                  summary: Esempio di risposta con lista di relazioni PDC
                  value:
                    - tipoRelazione: "FONDO"
                      classe: "Entrata/Spesa"
                      tipo: "Conto Standard"
                      livello: 3
                      segmento: "1.1"
                      codice: "1.1.2"
                      descrizione: "Conto fondo per entrata primaria"
                    - tipoRelazione: "CORRELAZIONE"
                      classe: "Capitale/Passività"
                      tipo: "Voce di Bilancio"
                      livello: 3
                      segmento: "1.2"
                      codice: "1.2.1"
                      descrizione: "Conto correlato per entrata primaria"
        "404":
          description: |
            Piano dei conti non trovato. Non esiste un conto con il codice specificato appartenente all'ente indicato,
            oppure il conto è inattivo, non ricercabile o cancellato.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: |
            Richiesta non valida. Il codice PDC fornito non è valido o non rispetta il formato atteso.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Si è verificato un errore imprevisto durante il recupero delle relazioni del piano dei conti.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
  /pdc/classi:
    get:
      tags:
        - business
      summary: Elenco delle classi dei piani dei conti
      description: |
        Recupera l'elenco completo delle classi disponibili per i piani dei conti (PDC) nel sistema.
        Le classi rappresentano le macrocategorie fondamentali in cui vengono raggruppati i conti contabili
        in base alla loro natura economica o patrimoniale, come ad esempio 'Entrata/Spesa', 'Capitale/Passività', 'Risultato Economico', ecc.
        Ogni classe è identificata da un codice univoco e include una descrizione esplicativa del suo significato contabile.
        Questo endpoint fornisce i valori di riferimento standard utilizzati per categorizzare i conti
        all'interno del piano dei conti e viene comunemente utilizzato per popolare liste di selezione
        nell'interfaccia utente o per applicare filtri durante la ricerca e la creazione di nuovi piani dei conti.
        Le classi sono condivise tra tutti gli enti e rappresentano una struttura di classificazione standardizzata.
        **Nota:** Questo endpoint restituisce solo le classi che hanno almeno un conto valido per l'anno di bilancio specificato nel JWT.
      operationId: getPdcClassi
      parameters:
      responses:
        "200":
          description: |
            Risposta contenente una lista completa delle classi dei piani dei conti disponibili nel sistema.
            Ogni elemento include tutti i dettagli della classe come codice univoco, descrizione completa
