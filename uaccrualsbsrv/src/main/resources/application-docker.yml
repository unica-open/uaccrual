# ===========================================
# ACCRUALSBSRV - Docker Environment Configuration
# ===========================================
# Configurazione specifica per ambiente Docker
# Questo file viene caricato quando SPRING_PROFILES_ACTIVE=docker

# ===========================================
# SERVER CONFIGURATION
# ===========================================
server:
  port: 10080

# ===========================================
# DEVELOPMENT AUTHENTICATION
# ===========================================
# Abilita autenticazione dev con token base64 (senza JWT)
# Il frontend invia token dev, il backend lo decodifica e autentica
dev:
  auth:
    enabled: true

# ===========================================
# DATABASE CONFIGURATION
# ===========================================

spring:
  datasource:
    url: jdbc:postgresql://0.0.0.0:5432/ACCRUAL
    username: accrual
    password: xxxx
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true



# ===========================================
# LOGGING CONFIGURATION
# ===========================================
logging:
  level:
    root: INFO
    it.csi.accrual.accrualsbsrv: DEBUG
    org.springframework: WARN
    org.springframework.boot.actuate: INFO
    org.hibernate: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.postgresql: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [%X{enteCodice}] [%X{requestId}] %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [%X{enteCodice}] [%X{requestId}] %msg%n"
  file:
    name: ${LOG_PATH:/tmp/logs/accrualsbsrv.log}
  logback:
    rollingpolicy:
      max-size: 10MB
      max-history: 30
