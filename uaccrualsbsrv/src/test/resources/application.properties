# Spring Boot properties for tests
# Use H2 in-memory database for a clean and isolated test environment
# MODE=PostgreSQL per compatibilità con nomi case-insensitive

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_UPPER=false
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Mostra l'SQL generato da Hibernate (utile per debug)
spring.jpa.show-sql=true

# Disabilita la gestione dello schema da parte di Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=accrual
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

spring.sql.init.schema-locations=classpath:schema.sql
# spring.sql.init.data-locations=classpath:test-data/soggetto.sql,classpath:test-data/pdc.sql
