# Configurazione per test di integrazione con PostgreSQL reale
# Usare solo per test che richiedono il database reale (es. PdcUnivocitaIntegrationTest)

# Database PostgreSQL reale
spring.datasource.url=jdbc:postgresql://10.138.154.6:10124/CON_ACCRUAL
spring.datasource.username=accrual
spring.datasource.password=mypass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=accrual
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Logging per debug
logging.level.it.csi.accrual=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Transazionalità per rollback automatico dopo ogni test
spring.test.database.replace=none
