# Configurazione NGINX per l'applicazione Angular con baseHref=/accrualwcl/

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Log files
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    server {
        listen 60080;
        server_name localhost;

        # Gestione specifica per la cartella di configurazione
        location /accrualwcl/assets/config/ {
            alias /usr/share/nginx/html/config/;
            try_files $uri $uri/ =404;
        }

        # Gestione per l'applicazione Angular con baseHref /accrualwcl/
        location /accrualwcl/ {
            alias /usr/share/nginx/html/;
            try_files $uri $uri/ /accrualwcl/index.html;
            
            # Disabilita cache per file JavaScript e CSS (sviluppo)
            location ~* \.(js|css)$ {
                expires -1;
                add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
                add_header Pragma "no-cache";
            }
        }

        # Proxy per il servizio accrualsbsrv
        location ^~ /accrualsbsrv/ {
            resolver 127.0.0.11 valid=10s;
            set $accrualsbsrv http://accrualsbsrv:10080;
            proxy_pass $accrualsbsrv;
            proxy_http_version 1.1;

            # Inoltra gli header necessari
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Header di autenticazione per lo sviluppo
            proxy_set_header Shib-Iride-IdentitaDigitale "MRARSS70H17I138F/MARIO/ROSSI/SP//1//";

            # Gestione specifica per l'header X-Ente-Codice richiesto dal backend
            proxy_set_header X-Ente-Codice $http_x_ente_codice;

            # Timeout e buffer per gestire richieste più lunghe
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }

        # Proxy per il servizio accrualsbapi
        location ^~ /accrualsbapi/ {
            resolver 127.0.0.11 valid=10s;
            set $accrualsbapi http://accrualsbapi:8080;
            proxy_pass $accrualsbapi;
            proxy_http_version 1.1;

            # Inoltra gli header necessari
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Header di autenticazione per lo sviluppo
            proxy_set_header Shib-Iride-IdentitaDigitale "MRARSS70H17I138F/MARIO/ROSSI/SP//1//";

            # Gestione specifica per l'header X-Ente-Codice richiesto dal backend
            proxy_set_header X-Ente-Codice $http_x_ente_codice;

            # Timeout e buffer per gestire richieste più lunghe
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;

            # Aggiungi supporto per upload di file grandi
            client_max_body_size 50M;
        }

        # Proxy per il servizio accrualreportsbapi (report BIRT)
        location ^~ /accrualreportsbapi/ {
            resolver 127.0.0.11 valid=10s;
            set $accrualreportsbapi http://accrualreportsbapi:10180;
            proxy_pass $accrualreportsbapi;
            proxy_http_version 1.1;

            # Inoltra gli header necessari
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Header di autenticazione per lo sviluppo
            proxy_set_header Shib-Iride-IdentitaDigitale "MRARSS70H17I138F/MARIO/ROSSI/SP//1//";

            # Gestione specifica per l'header X-Ente-Codice richiesto dal backend
            proxy_set_header X-Ente-Codice $http_x_ente_codice;

            # Timeout e buffer per gestire richieste più lunghe (report possono essere lenti)
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }

        # Proxy per il servizio accrualauthsbapi (autenticazione)
        location /accrualauthsbapi/ {
            resolver 127.0.0.11 valid=10s;
            set $accrualauthsbapi http://accrualauthsbapi:10380;
            proxy_pass $accrualauthsbapi;
            proxy_http_version 1.1;

            # Inoltra gli header necessari
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout e buffer
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }

        # Aggiungi intestazioni di sicurezza
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
