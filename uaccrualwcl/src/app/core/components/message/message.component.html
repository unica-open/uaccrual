<div 
  *ngIf="visible" 
  [ngClass]="getCssClass()" 
  class="p-4 mb-4 rounded-lg text-sm" 
  role="alert">
  <div class="flex items-start">
    <span class="mr-2" *ngIf="showIcon">{{ getIcon() }}</span>
    <div>
      <h3 class="font-medium" *ngIf="title">{{ title }}</h3>
      <p>{{ message }}</p>
    </div>
  </div>
</div>
