<div class="flex flex-col space-y-1">
  <label class="text-sm font-medium text-gray-700 dark:text-gray-300">
    {{ label }}
    <span *ngIf="required" class="text-red-500">*</span>
  </label>
  <select
    #selectElement
    (change)="onSelectionChange($event)"
    (blur)="onTouched()"
    [required]="required"
    [disabled]="disabled"
    class="px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 disabled:bg-gray-100 disabled:cursor-not-allowed"
  >
    <option value="" *ngIf="placeholder">{{ placeholder }}</option>
    <option *ngFor="let option of options" [value]="option.valore">
      {{ option.etichetta }}
    </option>
  </select>
</div>
