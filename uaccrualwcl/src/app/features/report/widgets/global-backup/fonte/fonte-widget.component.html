<div class="flex flex-col space-y-1">
  <label class="text-sm font-medium text-gray-700 dark:text-gray-300">
    {{ label }}
    <span *ngIf="required" class="text-red-500">*</span>
  </label>
  <select
    [value]="formControl ? formControl.value : value"
    (change)="onSelectionChange($event)"
    (blur)="onTouched()"
    [required]="required"
    [disabled]="disabled"
    class="px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-800 dark:text-white disabled:bg-gray-100 dark:disabled:bg-gray-700 disabled:cursor-not-allowed"
  >
    <option value="">Seleziona fonte...</option>
    <option *ngFor="let option of options" [value]="option.codice || option.valore">
      {{ option.descrizione || option.etichetta }} ({{ option.codice || option.valore }})
    </option>
  </select>
</div>
