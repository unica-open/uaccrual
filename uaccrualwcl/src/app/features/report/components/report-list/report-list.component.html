<main class="page">

  <div class="card">
    <div class="card-header">
      <div class="card-header-left">
        <span class="card-icon material-icons-round">assessment</span>
        <h2 class="card-title">Reportistica Accrual</h2>
      </div>
    </div>
    <div class="card-body">
      <p style="color:var(--fg-muted);font-size:13px;margin-bottom:20px">
        Seleziona un report dalla lista sottostante per configurare i parametri e generare il documento.
      </p>

      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px">
        <button *ngFor="let report of reportList"
                class="report-card"
                (click)="eseguiReport(report)">
          <div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:10px">
            <span class="material-icons-round" style="font-size:28px;color:var(--accent);flex-shrink:0">description</span>
            <div style="min-width:0;text-align:left">
              <div style="font-size:14px;font-weight:600;color:var(--fg);line-height:1.3">{{ report.nome }}</div>
              <span style="font-size:10px;font-family:var(--font-mono);color:var(--fg-muted);background:var(--surface-2);padding:2px 6px;border-radius:4px;margin-top:4px;display:inline-block">{{ report.codice }}</span>
            </div>
          </div>
          <p style="font-size:12px;color:var(--fg-muted);text-align:left;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:10px">{{ report.descrizione }}</p>
          <div style="display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border-color);padding-top:10px">
            <span style="font-size:11px;color:var(--fg-subtle)">Click per eseguire</span>
            <span style="font-size:12px;font-weight:600;color:var(--accent);display:flex;align-items:center;gap:4px">
              Esegui <span class="material-icons-round" style="font-size:14px">arrow_forward</span>
            </span>
          </div>
        </button>
      </div>
    </div>
  </div>

</main>
