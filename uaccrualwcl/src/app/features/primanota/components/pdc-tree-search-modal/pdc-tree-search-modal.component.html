<div class="p-6">
  <div class="flex justify-between items-center mb-4 pb-2 border-b border-gray-200">
    <h4 class="text-xl font-semibold text-gray-800">RICERCA CONTI ACCRUAL</h4>
    <button type="button" class="text-gray-500 hover:text-gray-700" aria-label="Close" (click)="dismiss()">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <!-- Visualizzazione dei filtri di ricerca -->
  <div class="mb-4 p-3 bg-gray-50 rounded-lg border border-gray-200 text-sm">
    <div class="font-medium text-gray-700 mb-1">Filtri applicati:</div>
    <div class="flex flex-wrap gap-4">
      <div *ngIf="searchCodice" class="flex items-center">
        <span class="font-semibold text-gray-600">Codice:</span>
        <span class="ml-2 text-gray-800">{{ searchCodice }}</span>
      </div>
      <div *ngIf="searchDescrizione" class="flex items-center">
        <span class="font-semibold text-gray-600">Descrizione:</span>
        <span class="ml-2 text-gray-800">{{ searchDescrizione }}</span>
      </div>
      <div *ngIf="!searchCodice && !searchDescrizione" class="text-gray-500 italic">
        Nessun filtro applicato
      </div>
    </div>
  </div>

  <div *ngIf="loading" class="flex justify-center items-center py-8">
    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500"></div>
  </div>

  <div *ngIf="errorMessage" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
    {{ errorMessage }}
  </div>

  <div *ngIf="!loading && !errorMessage" class="tree-container max-h-[60vh] overflow-y-auto">
    <div *ngIf="filteredResults.length === 0" class="text-center text-gray-500 py-8">
      Nessun conto trovato
    </div>

    <div *ngIf="filteredResults.length > 0" class="tree-list">
      <app-pdc-tree-node
        *ngFor="let node of filteredResults"
        [node]="node"
        [searchTerm]="''"
        (accountSelected)="selectAccount($event)">
      </app-pdc-tree-node>
    </div>
  </div>
</div>
