<div class="confirm-reset-container">
  <div class="confirm-reset-card">
    <div class="confirm-reset-header">
      <h1>Imposta Nuova Password</h1>
      <p>Inserisci il tuo codice fiscale e la nuova password</p>
    </div>

    <form [formGroup]="confirmForm" (ngSubmit)="onSubmit()" class="confirm-reset-form">
      <!-- Token nascosto, viene letto automaticamente dall'URL -->
      <input type="hidden" formControlName="token" />

      <div class="form-group">
        <label for="codiceFiscale">Codice Fiscale</label>
        <input
          type="text"
          id="codiceFiscale"
          formControlName="codiceFiscale"
          class="form-control"
          placeholder="Inserisci il tuo codice fiscale"
          [class.is-invalid]="submitted && f['codiceFiscale'].errors"
        />
        <div *ngIf="submitted && f['codiceFiscale'].errors" class="invalid-feedback">
          <span *ngIf="f['codiceFiscale'].errors?.['required']">Il codice fiscale è obbligatorio</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Nuova Password</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          class="form-control"
          placeholder="Inserisci la nuova password"
          [class.is-invalid]="submitted && f['password'].errors"
        />
        <div *ngIf="submitted && f['password'].errors" class="invalid-feedback">
          <span *ngIf="f['password'].errors?.['required']">La password è obbligatoria</span>
          <span *ngIf="f['password'].errors?.['minlength']">La password deve avere almeno 8 caratteri</span>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Conferma Password</label>
        <input
          type="password"
          id="confirmPassword"
          formControlName="confirmPassword"
          class="form-control"
          placeholder="Conferma la nuova password"
          [class.is-invalid]="submitted && f['confirmPassword'].errors"
        />
        <div *ngIf="submitted && f['confirmPassword'].errors" class="invalid-feedback">
          <span *ngIf="f['confirmPassword'].errors?.['required']">La conferma password è obbligatoria</span>
          <span *ngIf="!f['confirmPassword'].errors?.['required'] && confirmForm.hasError('passwordMismatch') && (f['confirmPassword'].touched || f['password'].touched)">
            Le password non coincidono
          </span>
        </div>
      </div>

      <div *ngIf="errorMessage" class="alert alert-error">
        {{ errorMessage }}
      </div>

      <div class="form-actions">
        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="loading"
        >
          <span *ngIf="loading" class="spinner"></span>
          <span *ngIf="!loading">Imposta Nuova Password</span>
        </button>
      </div>

      <div class="confirm-links">
        <a routerLink="/login" class="link">
          Torna al login
        </a>
      </div>
    </form>
  </div>
</div>
