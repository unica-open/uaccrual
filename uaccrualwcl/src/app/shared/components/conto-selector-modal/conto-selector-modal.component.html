<div class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h3 class="modal-title">Seleziona Conto</h3>
      <button class="modal-close-button" (click)="closeModal()">
        <span class="material-icons-outlined">close</span>
      </button>
    </div>
    <div class="modal-body">
      <section
        *ngIf="contiRicercati && contiRicercati.length > 0"
        class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden"
      >
          <div
            class="px-4 py-3 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center bg-slate-50/50 dark:bg-slate-900/50"
          >
              <h3 class="text-xs font-bold text-gray-700 uppercase tracking-widest">
                  Conti Trovati
              </h3>
              <span class="text-[10px] bg-primary/10 text-primary px-2 py-0.5 rounded-full font-bold">
                  {{ contiRicercati.length }} CONTI
              </span>
          </div>

          <div class="table-container overflow-x-auto">
              <table class="min-w-full divide-y divide-slate-200 dark:divide-slate-700">
                  <thead class="bg-slate-50 dark:bg-slate-800">
                      <tr>
                          <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider w-1/12">
                              Seleziona
                          </th>
                          <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider w-4/12">
                              Codice
                          </th>
                          <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider w-7/12">
                              Descrizione
                          </th>
                      </tr>
                  </thead>
                  <tbody class="bg-white dark:bg-surface-dark divide-y divide-slate-200 dark:divide-slate-700">
                      <tr *ngFor="let contoRicercato of contiRicercati; let i = index">
                          <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-slate-900 dark:text-slate-200 w-1/12">
                              <input
                                type="radio"
                                name="selectedPdc"
                                [value]="contoRicercato.codice"
                                [(ngModel)]="selectedPdcCodice"
                                (change)="onPdcSelected(contoRicercato)" />
                          </td>
                          <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500 dark:text-slate-400 w-4/12">
                              {{ contoRicercato.codice }}
                          </td>
                          <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500 dark:text-slate-400 w-7/12">
                              {{ contoRicercato.descrizione }}
                          </td>
                      </tr>
                  </tbody>
              </table>
          </div>
          
          <div class="flex justify-end p-4 bg-slate-50 dark:bg-slate-900">
              <button
                class="btn-primary"
                [disabled]="!selectedPdcCodice"
                (click)="confermaSelezionePdc()">
                  Conferma Selezione
              </button>
          </div>
      </section>
      <div
        *ngIf="!contiRicercati || contiRicercati.length === 0"
        class="px-4 py-3 bg-slate-50 dark:bg-slate-900
               text-[10px] text-slate-400 italic text-left"
      >
        Nessun conto trovato con i criteri specificati.
      </div>
    </div>
  </div>
</div>
