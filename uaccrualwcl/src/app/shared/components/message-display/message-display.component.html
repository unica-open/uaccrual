<div *ngIf="showMessage" [ngClass]="{
  'bg-red-50 border border-red-200 text-red-800': messageType === 'error',
  'bg-yellow-50 border border-yellow-200 text-yellow-800': messageType === 'warning',
  'bg-blue-50 border border-blue-200 text-blue-800': messageType === 'info',
  'bg-green-50 border border-green-200 text-green-800': messageType === 'success'
}" class="p-4 mb-4 rounded-lg text-sm" role="alert">
  <div class="flex items-start">
    <span class="mr-2" *ngIf="messageType === 'error'">❌</span>
    <span class="mr-2" *ngIf="messageType === 'warning'">⚠️</span>
    <span class="mr-2" *ngIf="messageType === 'info'">ℹ️</span>
    <span class="mr-2" *ngIf="messageType === 'success'">✅</span>
    <div>
      <h3 class="font-medium">{{ messageTitle }}</h3>
      <p>{{ messageText }}</p>

      <!-- Pulsanti per conferma/annulla quando è presente un messaggio di conferma -->
      <div *ngIf="showConfirmButtons" class="mt-3">
        <button
          type="button"
          (click)="onConfirmClick()"
          class="px-4 py-2 bg-green-600 text-white text-sm rounded hover:bg-green-700 mr-2">
          Conferma
        </button>
        <button
          type="button"
          (click)="onCancelClick()"
          class="px-4 py-2 bg-gray-500 text-white text-sm rounded hover:bg-gray-600">
          Annulla
        </button>
      </div>

      <button
        *ngIf="!showConfirmButtons && showCloseButton"
        type="button"
        (click)="onCloseClick()"
        class="mt-2 text-sm underline">
        Chiudi
      </button>
    </div>
  </div>
</div>
