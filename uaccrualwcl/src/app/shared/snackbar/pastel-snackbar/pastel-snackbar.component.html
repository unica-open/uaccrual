<div class="banner-notification" [ngClass]="'banner-' + data.type">
  <span class="material-icons-round banner-icon">{{ icon }}</span>
  <div class="banner-content">
    <strong>{{ data.title || title }}</strong>
    <span *ngIf="data.message">{{ data.message }}</span>
  </div>
  <button class="banner-close" (click)="close()" title="Chiudi">
    <span class="material-icons-round">close</span>
  </button>
</div>
