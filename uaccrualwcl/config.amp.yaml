productName: uaccrual
componentName: uaccrualwcl
stages:
  build: yes
build:
  buildFlow: sequential
  buildTool: npm_node
  buildToolVersion: node_18_19_0
  buildEnvironment: generic
  buildOptionString: "npm run build -- --configuration ${environment}"
builds_to_execute:
  build_wcl:
    artifactsToPublish:
  archive_wcl:
    artifactsToPublish: "accrualwcl-*.zip"
    customBuildTool: archive
    customBuildToolVersion: generic
    customBuildEnvironment: generic
    customArchive:
      archiveTool: zip
      archiveName: "accrualwcl-${PRODUCT_VERSION}.zip"
      archiveOptions: ""
      archiveFolders: "dist/accrualwcl*/browser"
      


