# Configurazione per test di integrazione con PostgreSQL reale
# Usare con: @ActiveProfiles("integration-test")

spring:
  datasource:
    url: jdbc:postgresql://10.138.154.6:10124/CON_ACCRUAL
    driver-class-name: org.postgresql.Driver
    username: accrual
    password: mypass

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# BIRT Configuration for tests
birt:
  render:
    temp:
      dir: ${java.io.tmpdir}/birt-test
    timeout-seconds: 30
  file:
    max-size: 52428800  # 50 MB

# Logging
logging:
  level:
    root: INFO
    it.csi.accrual.accrualreportsbapi: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Test specific configurations
test:
  async:
    fast-executor:
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 10
    slow-executor:
      core-pool-size: 1
      max-pool-size: 2
      queue-capacity: 5
