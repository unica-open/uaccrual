spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  
  h2:
    console:
      enabled: false

# BIRT Configuration for tests
birt:
  render:
    temp:
      dir: ${java.io.tmpdir}/birt-test
    timeout-seconds: 30
  file:
    max-size: 52428800  # 50 MB

# Logging
logging:
  level:
    root: INFO
    it.csi.accrual.accrualreportsbapi: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Test specific configurations
test:
  async:
    fast-executor:
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 10
    slow-executor:
      core-pool-size: 1
      max-pool-size: 2
      queue-capacity: 5
