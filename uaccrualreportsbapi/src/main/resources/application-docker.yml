# ===========================================
# ACCRUALREPORTSBAPI - Docker Environment Configuration
# ===========================================
# Configurazione specifica per ambiente Docker
# Questo file viene caricato quando SPRING_PROFILES_ACTIVE=docker

# ===========================================
# SERVER CONFIGURATION
# ===========================================
server:
  port: 10180

# ===========================================
# DEVELOPMENT AUTHENTICATION
# ===========================================
# Abilita autenticazione dev con token base64 (senza JWT)
# Il frontend invia token dev, il backend lo decodifica e autentica
dev:
  auth:
    enabled: true

# ===========================================
# DATABASE CONFIGURATION
# ===========================================

spring:
  datasource:
    url: jdbc:postgresql://0.0.0.0:5432/ACCRUAL
    username: accrual
    password: xxxc
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 15
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: true
      pool-name: BirtHikariPool



# ===========================================
# BIRT REPORTS DIRECTORY
# ===========================================
# Percorso della directory contenente i template .rptdesign
# In Docker, questo percorso è montato come volume esterno
birt:
  locale: it_IT
  reports:
    directory: /reports

# ===========================================
# LOGGING CONFIGURATION
# ===========================================
logging:
  level:
    root: INFO
    it.csi.accrual.accrualreportsbapi: DEBUG
    it.csi.accrual.accrualcommonsrv.security: DEBUG
    org.springframework: WARN
    org.springframework.boot.actuate: INFO
    org.eclipse.birt: WARN
    org.hibernate: INFO
    org.postgresql: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [%X{enteCodice}] [%X{requestId}] %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [%X{enteCodice}] [%X{requestId}] %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
  file:
    name: ${LOG_PATH:/tmp/logs/accrualreportsbapi.log}
