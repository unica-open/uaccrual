# ===========================================
# ACCRUALREPORTSBAPI - Application Configuration
# ===========================================
# Configurazione di base condivisa per tutti gli ambienti
# I parametri specifici (porta, database) sono in:
# - application-docker.yml (ambiente Docker)
# - application-local.yml (sviluppo locale)

# ===========================================
# 1. APPLICATION IDENTIFICATION
# ===========================================
spring:
  application:
    name: accrualreportsbapi
    version: 1.0.0
  main:
    allow-bean-definition-overriding: true
  jpa:
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

server:
  servlet:
    context-path: /accrualreportsbapi

# ===========================================
# 2. MANAGEMENT / ACTUATOR
# ===========================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

# ===========================================
# 3. SECURITY CONFIGURATION
# ===========================================
security:
  public-endpoints:
    - /api/v1/ping
    - /swagger-ui/**
    - /swagger-ui.html
    - /v3/api-docs/**
    - /actuator/**


# ===========================================
# 5. SPECIFIC CONFIGURATION (BIRT)
# ===========================================
# BIRT Report Configuration
birt:
  locale: it_IT
  render:
    temp:
      dir: ${java.io.tmpdir}/birt-processing
    timeout-seconds: 3600
  reports:
    directory: /appserv/springboot/accrualreport/reports/  

# CORS Configuration
cors:
  allowed-origins: "*"
  allowed-methods: GET,POST,OPTIONS
  allowed-headers: "*"
  allow-credentials: false
  max-age: 3600

# SpringDoc / Swagger Configuration
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
    enabled: true
  show-actuator: true


logging:
  file:
    name: logs/accrualreportsbapi.log
