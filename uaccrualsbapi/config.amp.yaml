# Il file config.yml definisce i comportamenti che la pipeline deve adottare sul codice sorgente
# e sulle unità di installazione per tutte le fasi del rilascio, dalla build al deployment.

productName: uaccrual
componentName: uaccrualsbapi
stages:
  build: yes
build:
  buildFlow: sequential
  buildTool: maven
  buildToolVersion: maven_3_8_1
  buildEnvironment: jdk_17_0_8
  buildOptionString: "clean install -DskipTests=true -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn -B -P ${environment}-${linea_cliente} "
builds_to_execute:
  uaccrualsbsrv:
    artifactsToPublish: target/accrualsbapi-*.gz