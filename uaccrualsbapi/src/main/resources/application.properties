spring.application.name=accrualsbapi
server.servlet.context-path=/accrualsbapi
server.port=8080
# Or adjust as needed

# Database configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://10.138.154.6:10124/COLL_ACCRUAL
spring.datasource.username=coll_accrual_rw
spring.datasource.password=mypass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# JWT configuration (secret letto dalla variabile d'ambiente JWT_SECRET)
jwt.secret=${JWT_SECRET:accrual-dev-secret-key-for-jwt-token-generation}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Livello di log
logging.level.it.csi.accrual=DEBUG

# Configurazione encoding per file CSV
# Usato da CsvReader per il parsing dei file di flusso
csv.encoding.default=UTF-8
csv.encoding.fallback=ISO-8859-1