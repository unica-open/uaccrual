# ===========================================
# ACCRUALSBAPI - Docker Environment Configuration
# ===========================================

# Development auth (gestisce token alg=none dal frontend in dev)
dev.auth.enabled=true

# JWT (hardcoded per ambiente dev/docker)
jwt.secret=accrual-dev-secret-key-for-jwt-token-generation
jwt.expiration=86400000

# Database
spring.datasource.url=jdbc:postgresql://0.0.0.0:5432/ACCRUAL
spring.datasource.username=accrual
spring.datasource.password=xxxx
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA batch
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Logging
logging.level.root=INFO
logging.level.it.csi.accrual.accrualsbapi=DEBUG
logging.level.org.springframework=WARN
