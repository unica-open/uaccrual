description:
  it:
    genericName: Gestione Amministrativo Contabile
    shortDescription: UNICA Accrual è il modulo della suite UNICA dedicato alla
      contabilità economico-patrimoniale della PA
    longDescription: >
      ### Sistema Informativo per la contabilità Economico-Patrimoniale per gli
      Enti

      UNICA Accrual è il modulo open source della suite UNICA dedicato alla gestione della contabilità economico-patrimoniale della Pubblica Amministrazione, progettato per accompagnare gli enti nella transizione verso il nuovo modello contabile Accrual e i principi ITAS. La soluzione integra dati contabili, patrimonio e processi amministrativi, supportando la gestione delle scritture economico-patrimoniali, delle prime note, delle rettifiche e delle integrazioni contabili. Consente la riconciliazione delle informazioni provenienti dai diversi sistemi gestionali, la gestione delle operazioni di chiusura e la produzione di giornale, mastrini, prospetti e report. Integrato con gli altri moduli della suite UNICA, contribuisce a migliorare qualità, tracciabilità, coerenza e trasparenza delle informazioni economiche e patrimoniali degli enti pubblici.
    features:
      - Acquisizione e ricerca flusso di alimentazione
      - Ricerca e gestione della prima nota
      - Elaborazione e ricerca Report
      - Popolamento del modello di raccordo
      - Gestione dei Conti accrual
      - Gestione delle causali
