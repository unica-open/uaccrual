# ===========================================
# ACCRUALAUTHSBAPI - Docker Environment Configuration
# ===========================================
# Configurazione specifica per ambiente Docker
# Questo file viene caricato quando SPRING_PROFILES_ACTIVE=docker

# ===========================================
# SERVER CONFIGURATION
# ===========================================
server:
  port: 10380

# ===========================================
# DATABASE CONFIGURATION
# ===========================================
spring:
  datasource:
    url: jdbc:postgresql://0.0.0.0:5432/ACCRUALAUTH
    username: accrualauth
    password: xxx
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 15
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: true
      pool-name: AuthHikariPool

  # ===========================================
  # JPA/HIBERNATE CONFIGURATION
  # ===========================================
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false
    open-in-view: false

  # ===========================================
  # FLYWAY CONFIGURATION
  # ===========================================
  flyway:
    enabled: false

  # ===========================================
  # MAIL CONFIGURATION (SMTP) - Mailpit per ambiente Docker
  # ===========================================
  mail:
    host: mailpit
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# ===========================================
# LOGGING CONFIGURATION
# ===========================================
logging:
  level:
    root: INFO
    it.csi.accrual.accrualauthsbapi: DEBUG
    org.springframework: WARN
    org.springframework.boot.actuate: INFO
    org.hibernate: INFO
    org.postgresql: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [%X{enteCodice}] [%X{requestId}] %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [%X{enteCodice}] [%X{requestId}] %msg%n"
  file:
    name: ${LOG_PATH:/tmp/logs/accrualauthsbapi.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30

# ===========================================
# APP CUSTOM CONFIGURATION
# ===========================================
app:
  mail:
    username: gestione.accrual@gmail.com
    token-reset-pwd-expiration: 300000
    reset-link: http://localhost:4200/accrualwcl/confirm-password-reset?token=

# Security Configuration - Public Endpoints
security:
  public-endpoints:
    - /api/v1/login
    - /api/v1/token-login
    - /api/v1/service-login
    - /api/v1/reset-password
    - /api/v1/confirm-password-reset
    - /api/v1/logout
    - /accrualauthsbapi/**
